<!doctype html>
<!--
  ⚠️ `dir="rtl"` و`lang="ar"` على الجذر — قاعدةُ المستودع في `CLAUDE.md`،
  وهي أكثرُ ما يُنسى فينعكس النصّ اللاتينيّ بصريًّا. وكلُّ رقمٍ أو اسمٍ
  لاتينيّ داخل الصفحة يُغلَّف `dir="ltr"` في موضعه.

  و`data-theme="light"` مكتوبةٌ هنا لا تُترك للجهاز — نفسُ قرار الموقع
  (١٤ أغسطس ٢٠٢٦): الفاتحُ أصلٌ، ومن اختار الداكن يكتب فوقها.
-->
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>طلبات العضوية — لوحة التحكّم</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      ⚠️ **لا فهرسة.** اللوحةُ خلف تسجيل دخول، ولا يُراد لعنوانها أن يظهر
      في نتائج البحث — كما في `metadata.robots` بلوحة Next.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
