<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 1016" width="1016" height="1016">
  <title>نادي نظم المعلومات الإدارية</title>
  <!--
    أيقونة التبويب — كحليٌّ داكن، لا الأزرق الأساسيّ (١٤ أغسطس ٢٠٢٦).

    ⚠️ **مربّعةٌ بلا استدارة عمدًا.** المتصفّح يعرضها كما هي في التبويب،
    والاستدارةُ المرسومة تُظهر زوايا شفّافة على شريطٍ فاتح. ومن أراد الشكل
    المستدير فذاك `apple-icon.tsx` — ونظامُ التشغيل هو من يقصّه هناك.

    ⚠️ **والعلامة ثلجيّةٌ صافية لا متدرّجة.** الأيقونة تُرسم 16px في
    التبويب، والتدرّج عندها يبتلع التباين فيصير الشعار لطخةً رمادية.
    فالتدرّج في الخلفية وحدها — لا يُقرأ صغيرًا ولا يضرّ كبيرًا.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#011c40"/>
      <stop offset="1" stop-color="#022d63"/>
    </linearGradient>
  </defs>
  <rect width="1016" height="1016" fill="url(#bg)"/>
  <g transform="translate(143.6 142.2) scale(0.72)" fill="#f9f9f9">
    <polygon points="460.0,0.0 813.0,0.0 659.8,339.0 306.8,339.0"/>
    <polygon points="659.0,339.0 1012.0,339.0 859.2,677.0 506.2,677.0"/>
    <polygon points="153.0,677.0 506.0,677.0 352.8,1016.0 -0.2,1016.0"/>
  </g>
</svg>
