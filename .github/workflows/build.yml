# فحصُ البناء — يمنع أن يصل إلى فرع النشر ما لا يُبنى.
#
# ⚠️ **وُلد من عطلٍ حقيقيّ في ١٤ أغسطس ٢٠٢٦.** دورةُ رسمٍ في `/admin/login`
# كانت تُسقط `next build` كلَّه عند التوليد المسبق، فعاشت **أربعةَ عشرَ
# التزامًا** على `main` بلا أن يكشفها أحد — لأن لا شيء كان يُبنى هنا: النشر
# يبني من مستودعٍ آخر، وهذا المستودع لا فحصَ فيه. ولمّا وصلت الشيفرة إلى فرع
# النشر سقط البناء هناك، فبقي الموقع الحيّ على نسخةٍ أقدم بلا إنذار.
#
# ⚠️⚠️ **ولذلك `npm run build` هنا لا يُستغنى عنه بـ`tsc` و`lint`.** ذلك
# العطل **مرّ من الاثنين نظيفًا** — لا خطأ أنواعٍ فيه ولا مخالفةَ قاعدة،
# ولا يظهر إلّا حين تُولَّد الصفحات. فمن اختصر هذي الخطوة يومًا ظنًّا أنها
# تكرارٌ بطيء، أعاد العطل نفسَه.

name: فحص البناء

on:
  push:
    branches: [main]
  pull_request:

# لا صلاحيةَ كتابةٍ يحتاجها الفحص — يقرأ الشيفرة ويبني، لا أكثر
permissions:
  contents: read

# دفعتان متتاليتان على الفرع نفسه: تُلغى الأولى ولا يُبنى ما تجاوزه غيرُه
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tsc · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # يطابق ما يبني به Vercel — واختلافُ الإصدار يجعل الفحصَ يكذب
          node-version: 22
          cache: npm

      # `ci` لا `install`: تُثبَّت الأقفال كما هي، فلا يمرّ بناءٌ باعتماديةٍ
      # أحدثَ ممّا في `package-lock.json` ثم يسقط عند النشر
      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # ⚠️ **بلا متغيّرات بيئة — عمدًا.** البناء لا يحتاجها اليوم، وسقوطُه
      # هنا لغيابها يعني أن شيئًا صار يقرؤها وقتَ البناء لا وقتَ التشغيل —
      # وهو ما سيُسقط بناء Vercel نفسَه. فالفشلُ هنا إنذارٌ لا إزعاج، وعلاجُه
      # أن تُضاف القيمة في `Settings → Secrets and variables → Actions`
      # وتُمرَّر في `env:` أدناه — لا أن تُحذف هذي الخطوة.
      - name: next build
        run: npm run build
